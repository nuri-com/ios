name: Nuri PRF Import Boundary

on:
  pull_request:
    paths:
      - ".github/workflows/nuri-prf-import.yml"
      - "Bitwarden.xcworkspace/xcshareddata/swiftpm/Package.resolved"
      - "AuthenticatorShared/UI/Vault/PreviewContent/BitwardenSdk+VaultFixtures.swift"
      - "BitwardenKit/Core/Vault/Services/Mocks/BitwardenSdk+VaultMocking.swift"
      - "BitwardenShared/Core/Tools/Repositories/ImportCiphersRepository*"
      - "BitwardenShared/Core/Tools/Repositories/ImportCiphersSDKBoundaryTests.swift"
      - "BitwardenShared/Core/Vault/Extensions/BitwardenSdk+Vault.swift"
      - "BitwardenShared/Core/Vault/Extensions/BitwardenSdkVaultTests.swift"
      - "BitwardenShared/Core/Vault/Models/API/CipherLoginFido2Credential.swift"
      - "BitwardenShared/Core/Vault/Services/API/Fixtures/syncWithCipher.json"
      - "BitwardenShared/Core/Vault/Services/API/Sync/SyncAPIServiceTests.swift"
      - "BitwardenShared/Core/Vault/Services/SyncServiceTests.swift"
      - "BitwardenShared/Core/Vault/Services/TestHelpers/CXFPasskeyPRF+Fixtures.swift"
      - "BitwardenShared/UI/Tools/ImportCXF/ImportCXF/ImportCXFProcessor*"
      - "BitwardenShared/UI/Vault/PreviewContent/BitwardenSdk+VaultFixtures.swift"
      - "project-common.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NURI_SDK_REF: 729a39aaf585782f11d19c3c650b3356ed0f52be

jobs:
  test-prf-import-boundary:
    name: AuthenticationServices to SDK cipher preservation
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out iOS fork
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: ios
          persist-credentials: false

      - name: Select Xcode 26.5
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: "26.5"

      - name: Verify published SDK pin
        working-directory: ios
        run: |
          grep -q "url: https://github.com/nuri-com/sdk-swift" project-common.yml
          grep -q "revision: $NURI_SDK_REF" project-common.yml
          test "$(jq -r '.pins[] | select(.identity == "sdk-swift") | .location' Bitwarden.xcworkspace/xcshareddata/swiftpm/Package.resolved)" = "https://github.com/nuri-com/sdk-swift"
          test "$(jq -r '.pins[] | select(.identity == "sdk-swift") | .state.revision' Bitwarden.xcworkspace/xcshareddata/swiftpm/Package.resolved)" = "$NURI_SDK_REF"

      - name: Install iOS build tools
        working-directory: ios
        run: brew bundle

      - name: Generate projects with the published SDK
        working-directory: ios
        run: |
          ./Scripts/bootstrap.sh || ./Scripts/bootstrap.sh

      - name: Test import and SDK boundaries
        working-directory: ios
        run: |
          xcrun xcodebuild test \
            -workspace Bitwarden.xcworkspace \
            -scheme BitwardenShared \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5" \
            -derivedDataPath build/DerivedData \
            -only-testing:BitwardenSharedTests/CXFPasskeyPRFFixturesTests \
            -only-testing:BitwardenSharedTests/ImportCiphersSDKBoundaryTests \
            -only-testing:BitwardenSharedTests/ImportCiphersRepositoryTests \
            -only-testing:BitwardenSharedTests/ImportCXFProcessorTests \
            -only-testing:BitwardenSharedTests/BitwardenSdkVaultFido2CredentialTests \
            -only-testing:BitwardenSharedTests/SyncAPIServiceTests/test_sync_withCiphers \
            -only-testing:BitwardenSharedTests/SyncServiceTests/test_fetchSync_ciphers \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Compile Authenticator shared call sites
        working-directory: ios
        run: |
          xcrun xcodebuild build \
            -workspace Bitwarden.xcworkspace \
            -scheme AuthenticatorShared \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
